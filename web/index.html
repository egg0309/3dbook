<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080605" />
    <meta
      name="description"
      content="星火长征数字思政育人平台 · 第一章 遵义会议。以 3D 立体书呈现长征中的关键转折。"
    />
    <title>星火长征 · 遵义会议</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader" aria-hidden="true">
      <div class="bl-star">
        <svg viewBox="0 0 64 64">
          <path
            d="M32 3.5 40.2 24l22 .9-17.1 13.5 6.1 21.1L32 46.8 12.8 59.5l6.1-21.1L1.8 24.9l22-.9Z"
          />
        </svg>
      </div>
      <p class="bl-brand">星火长征</p>
      <p class="bl-sub">正在翻开史册…</p>
      <span class="bl-line"></span>
    </div>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 0;
        background: radial-gradient(
          ellipse at 50% 46%,
          #17110c 0%,
          #0a0706 58%,
          #080605 100%
        );
        transition: opacity 0.6s ease;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        pointer-events: none;
      }
      .bl-star {
        width: 52px;
        height: 52px;
        color: #d0402f;
        filter: drop-shadow(0 0 20px rgba(190, 52, 36, 0.55));
        animation: bl-pulse 2.6s ease-in-out infinite;
      }
      .bl-star svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      .bl-brand {
        margin: 12px 0 0;
        font-family:
          'STZhongsong', '华文中宋', 'Songti SC', 'Noto Serif SC', serif;
        font-size: 22px;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #e8dcc4;
      }
      .bl-sub {
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.24em;
        color: #b6a98f;
      }
      .bl-line {
        width: 150px;
        height: 1px;
        margin-top: 14px;
        background: rgba(232, 220, 196, 0.12);
        overflow: hidden;
      }
      .bl-line::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #d0402f, transparent);
        animation: bl-sweep 1.7s ease-in-out infinite;
      }
      @keyframes bl-pulse {
        0%,
        100% {
          opacity: 0.75;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes bl-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(340%);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
